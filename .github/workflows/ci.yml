name: CI

# Runs lint/build/test on every pull request and on pushes to main, so a
# broken change is caught before merge instead of only being noticed at
# release time (see docker-publish.yml, which only runs on version tags).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      # Unit specs only — no Postgres needed (mocked repos/DataSource, see AGENTS.md).
      - name: Test
        run: npm test
