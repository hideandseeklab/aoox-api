name: Build and push Docker image

# Runs on every version tag (v0.1.0-alpha.0, v1.2.3, ...). package.json's
# `version` is the source of truth: `npm version <x>` bumps it and creates the
# matching tag; `git push --follow-tags` sends both to GitHub, which triggers
# this workflow. Manual runs are also allowed for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: hideandseeklab/aoox-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Strip the leading "v" so the image tag matches package.json's version
      # exactly (v0.1.0-alpha.0 -> 0.1.0-alpha.0).
      - name: Derive image version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
