name: Feature request
description: Suggest an idea or improvement for aoox.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the single place for feature requests for the API, the dashboard, the CLI/installer and the docs/website.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Dashboard / web
        - API
        - CLI / installer
        - Docs / website
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
    validations:
      required: false
